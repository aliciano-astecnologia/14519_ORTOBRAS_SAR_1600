<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef2f7"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/>
    </marker>
    <style>
      .title { font: 700 34px 'Segoe UI', Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 18px 'Segoe UI', Arial, sans-serif; fill: #475569; }
      .state-title { font: 700 20px Consolas, 'Courier New', monospace; fill: #ffffff; }
      .body { font: 16px 'Segoe UI', Arial, sans-serif; fill: #1e293b; }
      .code { font: 600 15px Consolas, 'Courier New', monospace; fill: #0f172a; }
      .edge { fill: none; stroke: #334155; stroke-width: 3; marker-end: url(#arrow); }
      .edge-red { fill: none; stroke: #dc2626; stroke-width: 3; stroke-dasharray: 9 7; marker-end: url(#arrowRed); }
      .label-bg { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; rx: 8; }
      .edge-label { font: 600 14px Consolas, 'Courier New', monospace; fill: #1e293b; }
      .red-label { font: 700 14px Consolas, 'Courier New', monospace; fill: #b91c1c; }
      .note-title { font: 700 17px 'Segoe UI', Arial, sans-serif; fill: #0f172a; }
      .note { font: 15px 'Segoe UI', Arial, sans-serif; fill: #334155; }
    </style>
  </defs>

  <rect width="1600" height="1050" fill="url(#bg)"/>

  <text x="800" y="48" text-anchor="middle" class="title">Máquina de estados — App.c (11928 STM8S)</text>
  <text x="800" y="78" text-anchor="middle" class="subtitle">Estados, entradas e saídas com os mesmos identificadores utilizados no firmware</text>

  <!-- Estado inicial -->
  <circle cx="64" cy="190" r="13" fill="#0f172a"/>
  <path d="M77 190 H125" class="edge"/>

  <!-- APP_STATE_OFF -->
  <g filter="url(#shadow)">
    <rect x="125" y="115" width="330" height="150" rx="18" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
    <path d="M143 115 H437 Q455 115 455 133 V158 H125 V133 Q125 115 143 115" fill="#475569"/>
    <text x="290" y="144" text-anchor="middle" class="state-title">APP_STATE_OFF</text>
    <text x="150" y="190" class="code">ControleElevador(ELEVADOR_PARA)</text>
    <text x="150" y="219" class="code">DESLIGA_RELE_FECHA()</text>
    <text x="150" y="248" class="body">Aguarda habilitação do ônibus</text>
  </g>

  <!-- APP_STATE_SELECAO -->
  <g filter="url(#shadow)">
    <rect x="640" y="115" width="330" height="150" rx="18" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
    <path d="M658 115 H952 Q970 115 970 133 V158 H640 V133 Q640 115 658 115" fill="#2563eb"/>
    <text x="805" y="144" text-anchor="middle" class="state-title">APP_STATE_SELECAO</text>
    <text x="665" y="190" class="body">Avalia limites e comandos</text>
    <text x="665" y="219" class="code">TECLA_SOBE</text>
    <text x="795" y="219" class="code">TECLA_DESCE</text>
    <text x="665" y="248" class="body">Movimento ainda não acionado</text>
  </g>

  <!-- APP_STATE_ESTACIONADO -->
  <g filter="url(#shadow)">
    <rect x="1125" y="115" width="350" height="150" rx="18" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
    <path d="M1143 115 H1457 Q1475 115 1475 133 V158 H1125 V133 Q1125 115 1143 115" fill="#7c3aed"/>
    <text x="1300" y="144" text-anchor="middle" class="state-title">APP_STATE_ESTACIONADO</text>
    <text x="1150" y="194" class="body">Aguarda comando da botoeira</text>
    <text x="1150" y="225" class="code">TECLA_SOBE / TECLA_DESCE</text>
  </g>

  <!-- APP_STATE_DESCE -->
  <g filter="url(#shadow)">
    <rect x="265" y="555" width="390" height="180" rx="18" fill="#ffffff" stroke="#d97706" stroke-width="2"/>
    <path d="M283 555 H637 Q655 555 655 573 V601 H265 V573 Q265 555 283 555" fill="#d97706"/>
    <text x="460" y="586" text-anchor="middle" class="state-title">APP_STATE_DESCE</text>
    <text x="290" y="632" class="code">TECLA_DESCE pressionada:</text>
    <text x="290" y="660" class="code">ELEVADOR_DESCE</text>
    <text x="290" y="688" class="code">LIGA_BOBINA_DESCE()</text>
    <text x="290" y="716" class="body">Soltar a tecla → ELEVADOR_PARA</text>
  </g>

  <!-- APP_STATE_SOBE -->
  <g filter="url(#shadow)">
    <rect x="925" y="555" width="420" height="180" rx="18" fill="#ffffff" stroke="#059669" stroke-width="2"/>
    <path d="M943 555 H1327 Q1345 555 1345 573 V601 H925 V573 Q925 555 943 555" fill="#059669"/>
    <text x="1135" y="586" text-anchor="middle" class="state-title">APP_STATE_SOBE</text>
    <text x="950" y="632" class="code">TECLA_SOBE pressionada:</text>
    <text x="950" y="660" class="code">ELEVADOR_SOBE</text>
    <text x="950" y="688" class="code">LIGA_BOBINA_SOBE()</text>
    <text x="950" y="716" class="body">Limite ativo ou tecla solta → para</text>
  </g>

  <!-- OFF -> SELECAO -->
  <path d="M455 183 H640" class="edge"/>
  <rect x="480" y="132" width="136" height="42" class="label-bg"/>
  <text x="548" y="150" text-anchor="middle" class="edge-label">SINAL_ONIBUS_ATIVO</text>
  <text x="548" y="167" text-anchor="middle" class="edge-label">LIGA_RELE_FECHA()</text>

  <!-- SELECAO -> ESTACIONADO -->
  <path d="M970 190 H1125" class="edge"/>
  <rect x="980" y="132" width="135" height="50" class="label-bg"/>
  <text x="1047" y="150" text-anchor="middle" class="edge-label">!LATERAL_ATIVO</text>
  <text x="1047" y="170" text-anchor="middle" class="edge-label">ou !GUARDADO_ATIVO</text>

  <!-- SELECAO -> DESCE -->
  <path d="M725 265 C680 350 570 430 500 555" class="edge"/>
  <rect x="552" y="387" width="142" height="31" class="label-bg"/>
  <text x="623" y="408" text-anchor="middle" class="edge-label">TECLA_DESCE</text>

  <!-- SELECAO -> SOBE -->
  <path d="M885 265 C930 350 1050 430 1090 555" class="edge"/>
  <rect x="914" y="387" width="250" height="48" class="label-bg"/>
  <text x="1039" y="406" text-anchor="middle" class="edge-label">TECLA_SOBE</text>
  <text x="1039" y="425" text-anchor="middle" class="edge-label">&amp;&amp; !SENSOR_LIMITE_SUBIDA_ATIVO</text>

  <!-- ESTACIONADO -> DESCE -->
  <path d="M1190 265 C1070 350 790 430 585 555" class="edge"/>
  <rect x="768" y="458" width="142" height="31" class="label-bg"/>
  <text x="839" y="479" text-anchor="middle" class="edge-label">TECLA_DESCE</text>

  <!-- ESTACIONADO -> SOBE -->
  <path d="M1300 265 C1300 370 1240 450 1190 555" class="edge"/>
  <rect x="1252" y="392" width="265" height="48" class="label-bg"/>
  <text x="1384" y="411" text-anchor="middle" class="edge-label">TECLA_SOBE</text>
  <text x="1384" y="430" text-anchor="middle" class="edge-label">&amp;&amp; !SENSOR_LIMITE_SUBIDA_ATIVO</text>

  <!-- DESCE -> SELECAO -->
  <path d="M400 555 C390 420 540 315 690 265" class="edge"/>
  <rect x="355" y="455" width="240" height="48" class="label-bg"/>
  <text x="475" y="474" text-anchor="middle" class="edge-label">!TECLA_DESCE</text>
  <text x="475" y="493" text-anchor="middle" class="edge-label">ELEVADOR_PARA</text>

  <!-- SOBE -> SELECAO -->
  <path d="M1000 555 C930 450 850 360 835 265" class="edge"/>
  <rect x="740" y="458" width="210" height="48" class="label-bg"/>
  <text x="845" y="477" text-anchor="middle" class="edge-label">!TECLA_SOBE</text>
  <text x="845" y="496" text-anchor="middle" class="edge-label">ELEVADOR_PARA</text>

  <!-- Perda do sinal: regra global de retorno para OFF -->
  <path d="M168 326 C170 292 215 278 250 265" class="edge-red"/>
  <rect x="48" y="326" width="238" height="75" rx="8" fill="#fff7f7" stroke="#fecaca" stroke-width="1.5"/>
  <text x="167" y="348" text-anchor="middle" class="red-label">DE QUALQUER ESTADO:</text>
  <text x="167" y="370" text-anchor="middle" class="red-label">!SINAL_ONIBUS_ATIVO</text>
  <text x="167" y="391" text-anchor="middle" class="red-label">→ APP_STATE_OFF</text>

  <!-- Contagem -->
  <rect x="944" y="760" width="384" height="72" rx="12" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="2"/>
  <text x="1136" y="786" text-anchor="middle" class="note-title">Evento durante APP_STATE_SOBE</text>
  <text x="1136" y="812" text-anchor="middle" class="code">SENSOR_LIMITE_SUBIDA_ATIVO ↑ → AppCiclosInc()</text>

  <!-- Regras comuns -->
  <g filter="url(#shadow)">
    <rect x="105" y="875" width="1390" height="125" rx="16" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="135" y="910" class="note-title">Regras comuns da aplicação</text>
    <text x="135" y="941" class="note">• ControleElevador(): em toda troca de comando, desliga BOBINA_SOBE e BOBINA_DESCE por TEMPO_TROCA_ESTADO_MS (50 ms).</text>
    <text x="135" y="970" class="note">• SENSOR_LIMITE_SUBIDA_ATIVO impede/encerra a subida. A descida depende de TECLA_DESCE e SINAL_ONIBUS_ATIVO.</text>
    <text x="135" y="989" class="note">• RELE_FECHA segue a habilitação por SINAL_ONIBUS_ATIVO; TECLA_FECHA não cria transição em App.c.</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1250" viewBox="0 0 1800 1250">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef2f7"/>
    </linearGradient>
    <filter id="shadow" x="-12%" y="-12%" width="124%" height="135%">
      <feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#0f172a" flood-opacity="0.16"/>
    </filter>
    <style>
      .title { font: 700 38px 'Segoe UI', Arial, sans-serif; fill:#0f172a; }
      .subtitle { font: 400 19px 'Segoe UI', Arial, sans-serif; fill:#475569; }
      .panel-title { font: 700 24px 'Segoe UI', Arial, sans-serif; fill:#0f172a; }
      .pin { font: 800 30px 'Segoe UI', Arial, sans-serif; fill:#0f172a; }
      .pin-dark { font: 800 30px 'Segoe UI', Arial, sans-serif; fill:#ffffff; }
      .func { font: 700 15px 'Segoe UI', Arial, sans-serif; fill:#172033; }
      .func-dark { font: 700 15px 'Segoe UI', Arial, sans-serif; fill:#ffffff; }
      .small { font: 500 14px 'Segoe UI', Arial, sans-serif; fill:#475569; }
      .table-head { font: 700 16px 'Segoe UI', Arial, sans-serif; fill:#ffffff; }
      .table-pin { font: 800 17px 'Segoe UI', Arial, sans-serif; fill:#0f172a; }
      .table-text { font: 600 16px 'Segoe UI', Arial, sans-serif; fill:#1e293b; }
      .code { font: 600 14px Consolas, 'Courier New', monospace; fill:#334155; }
      .legend { font: 600 15px 'Segoe UI', Arial, sans-serif; fill:#334155; }
    </style>
  </defs>

  <rect width="1800" height="1250" fill="url(#bg)"/>
  <rect x="0" y="0" width="1800" height="18" fill="#2563eb"/>

  <text x="900" y="68" text-anchor="middle" class="title">PINAGEM EXTERNA — PRODUTO 11928 (STM8S)</text>
  <text x="900" y="101" text-anchor="middle" class="subtitle">Vista frontal conforme a numeração física da etiqueta • o CN2 interno aparece espelhado</text>

  <!-- Painel conector principal -->
  <g filter="url(#shadow)">
    <rect x="70" y="145" width="1110" height="505" rx="22" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  </g>
  <text x="110" y="188" class="panel-title">CONECTOR PRINCIPAL — 12 VIAS</text>
  <text x="110" y="218" class="small">Orientação frontal igual à etiqueta do produto</text>

  <!-- Corpo do conector 12 vias -->
  <rect x="118" y="260" width="1014" height="308" rx="18" fill="#172033" stroke="#0f172a" stroke-width="4"/>
  <rect x="524" y="247" width="200" height="25" rx="8" fill="#172033"/>

  <!-- Linha superior: 12 11 10 9 8 7 -->
  <g>
    <rect x="135" y="278" width="157" height="128" rx="10" fill="#e2e8f0"/>
    <text x="213" y="322" text-anchor="middle" class="pin">12</text>
    <text x="213" y="365" text-anchor="middle" class="func">GND</text>

    <rect x="300" y="278" width="157" height="128" rx="10" fill="#2563eb"/>
    <text x="378" y="322" text-anchor="middle" class="pin-dark">11</text>
    <text x="378" y="355" text-anchor="middle" class="func-dark">RELÉ SOBE</text>
    <text x="378" y="378" text-anchor="middle" class="func-dark">MOTOR (+)</text>

    <rect x="465" y="278" width="157" height="128" rx="10" fill="#2563eb"/>
    <text x="543" y="322" text-anchor="middle" class="pin-dark">10</text>
    <text x="543" y="355" text-anchor="middle" class="func-dark">RELÉ DESCE</text>
    <text x="543" y="378" text-anchor="middle" class="func-dark">(+)</text>

    <rect x="630" y="278" width="157" height="128" rx="10" fill="#2563eb"/>
    <text x="708" y="322" text-anchor="middle" class="pin-dark">9</text>
    <text x="708" y="355" text-anchor="middle" class="func-dark">RELÉ FECHA</text>
    <text x="708" y="378" text-anchor="middle" class="func-dark">(+)</text>

    <rect x="795" y="278" width="157" height="128" rx="10" fill="#16a34a"/>
    <text x="873" y="322" text-anchor="middle" class="pin-dark">8</text>
    <text x="873" y="355" text-anchor="middle" class="func-dark">SENSOR</text>
    <text x="873" y="378" text-anchor="middle" class="func-dark">CONTADOR (+)</text>

    <rect x="960" y="278" width="157" height="128" rx="10" fill="#e2e8f0"/>
    <text x="1038" y="322" text-anchor="middle" class="pin">7</text>
    <text x="1038" y="365" text-anchor="middle" class="func">NC</text>
  </g>

  <!-- Linha inferior: 6 5 4 3 2 1 -->
  <g>
    <rect x="135" y="422" width="157" height="128" rx="10" fill="#dc2626"/>
    <text x="213" y="466" text-anchor="middle" class="pin-dark">6</text>
    <text x="213" y="510" text-anchor="middle" class="func-dark">+24 V</text>

    <rect x="300" y="422" width="157" height="128" rx="10" fill="#f59e0b"/>
    <text x="378" y="466" text-anchor="middle" class="pin">5</text>
    <text x="378" y="499" text-anchor="middle" class="func">SINAL ÔNIBUS</text>
    <text x="378" y="522" text-anchor="middle" class="func">(−)</text>

    <rect x="465" y="422" width="157" height="128" rx="10" fill="#16a34a"/>
    <text x="543" y="466" text-anchor="middle" class="pin-dark">4</text>
    <text x="543" y="499" text-anchor="middle" class="func-dark">LIMITE</text>
    <text x="543" y="522" text-anchor="middle" class="func-dark">SUBIDA (+)</text>

    <rect x="630" y="422" width="157" height="128" rx="10" fill="#16a34a"/>
    <text x="708" y="462" text-anchor="middle" class="pin-dark">3</text>
    <text x="708" y="491" text-anchor="middle" class="func-dark">LIMITE</text>
    <text x="708" y="514" text-anchor="middle" class="func-dark">GUARDADO/</text>
    <text x="708" y="537" text-anchor="middle" class="func-dark">FECHA (+)</text>

    <rect x="795" y="422" width="157" height="128" rx="10" fill="#16a34a"/>
    <text x="873" y="466" text-anchor="middle" class="pin-dark">2</text>
    <text x="873" y="499" text-anchor="middle" class="func-dark">LIMITE</text>
    <text x="873" y="522" text-anchor="middle" class="func-dark">LATERAL (+)</text>

    <rect x="960" y="422" width="157" height="128" rx="10" fill="#e2e8f0"/>
    <text x="1038" y="466" text-anchor="middle" class="pin">1</text>
    <text x="1038" y="510" text-anchor="middle" class="func">GND</text>
  </g>

  <!-- Painel LIN -->
  <g filter="url(#shadow)">
    <rect x="1220" y="145" width="510" height="505" rx="22" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  </g>
  <text x="1260" y="188" class="panel-title">BOTOEIRA LIN — 6 VIAS</text>
  <text x="1260" y="218" class="small">Comandos TECLA_SOBE, TECLA_DESCE e TECLA_FECHA</text>

  <rect x="1300" y="270" width="350" height="278" rx="18" fill="#172033" stroke="#0f172a" stroke-width="4"/>
  <rect x="1410" y="257" width="130" height="25" rx="8" fill="#172033"/>

  <!-- LIN superior: 6 5 4 -->
  <rect x="1317" y="288" width="100" height="112" rx="9" fill="#e2e8f0"/>
  <text x="1367" y="330" text-anchor="middle" class="pin">6</text>
  <text x="1367" y="370" text-anchor="middle" class="func">GND</text>

  <rect x="1425" y="288" width="100" height="112" rx="9" fill="#e2e8f0"/>
  <text x="1475" y="330" text-anchor="middle" class="pin">5</text>
  <text x="1475" y="370" text-anchor="middle" class="func">NC</text>

  <rect x="1533" y="288" width="100" height="112" rx="9" fill="#dc2626"/>
  <text x="1583" y="330" text-anchor="middle" class="pin-dark">4</text>
  <text x="1583" y="370" text-anchor="middle" class="func-dark">+12 V</text>

  <!-- LIN inferior: 3 2 1 -->
  <rect x="1317" y="418" width="100" height="112" rx="9" fill="#e2e8f0"/>
  <text x="1367" y="460" text-anchor="middle" class="pin">3</text>
  <text x="1367" y="500" text-anchor="middle" class="func">NC</text>

  <rect x="1425" y="418" width="100" height="112" rx="9" fill="#e2e8f0"/>
  <text x="1475" y="460" text-anchor="middle" class="pin">2</text>
  <text x="1475" y="500" text-anchor="middle" class="func">NC</text>

  <rect x="1533" y="418" width="100" height="112" rx="9" fill="#7c3aed"/>
  <text x="1583" y="460" text-anchor="middle" class="pin-dark">1</text>
  <text x="1583" y="500" text-anchor="middle" class="func-dark">LIN</text>

  <!-- Legenda -->
  <rect x="1238" y="576" width="18" height="18" rx="4" fill="#16a34a"/><text x="1266" y="591" class="legend">Entradas positivas</text>
  <rect x="1445" y="576" width="18" height="18" rx="4" fill="#f59e0b"/><text x="1473" y="591" class="legend">Entrada negativa</text>
  <rect x="1238" y="610" width="18" height="18" rx="4" fill="#2563eb"/><text x="1266" y="625" class="legend">Saídas positivas</text>
  <rect x="1445" y="610" width="18" height="18" rx="4" fill="#dc2626"/><text x="1473" y="625" class="legend">Alimentação</text>

  <!-- Resumo firmware -->
  <g filter="url(#shadow)">
    <rect x="70" y="700" width="1660" height="485" rx="22" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  </g>
  <text x="110" y="746" class="panel-title">REFERÊNCIA DA APLICAÇÃO</text>

  <!-- Cabeçalhos -->
  <rect x="110" y="775" width="760" height="42" rx="8" fill="#334155"/>
  <text x="135" y="802" class="table-head">PINOS 1 A 6</text>
  <rect x="930" y="775" width="760" height="42" rx="8" fill="#334155"/>
  <text x="955" y="802" class="table-head">PINOS 7 A 12</text>

  <!-- Coluna esquerda -->
  <g>
    <text x="135" y="852" class="table-pin">1</text><text x="180" y="852" class="table-text">GND</text>
    <line x1="125" y1="870" x2="850" y2="870" stroke="#e2e8f0"/>
    <text x="135" y="905" class="table-pin">2</text><text x="180" y="905" class="table-text">Limite lateral (+)</text><text x="470" y="905" class="code">SENSOR_LIMITE_LATERAL_ATIVO</text>
    <line x1="125" y1="923" x2="850" y2="923" stroke="#e2e8f0"/>
    <text x="135" y="958" class="table-pin">3</text><text x="180" y="958" class="table-text">Limite guardado/fecha (+)</text><text x="470" y="958" class="code">SENSOR_LIMITE_GUARDADO_ATIVO</text>
    <line x1="125" y1="976" x2="850" y2="976" stroke="#e2e8f0"/>
    <text x="135" y="1011" class="table-pin">4</text><text x="180" y="1011" class="table-text">Limite de subida (+)</text><text x="470" y="1011" class="code">SENSOR_LIMITE_SUBIDA_ATIVO</text>
    <line x1="125" y1="1029" x2="850" y2="1029" stroke="#e2e8f0"/>
    <text x="135" y="1064" class="table-pin">5</text><text x="180" y="1064" class="table-text">Sinal do ônibus (−)</text><text x="470" y="1064" class="code">SINAL_ONIBUS_ATIVO</text>
    <line x1="125" y1="1082" x2="850" y2="1082" stroke="#e2e8f0"/>
    <text x="135" y="1117" class="table-pin">6</text><text x="180" y="1117" class="table-text">Alimentação +24 V</text><text x="470" y="1117" class="code">+VIN</text>
  </g>

  <!-- Coluna direita -->
  <g>
    <text x="955" y="852" class="table-pin">7</text><text x="1000" y="852" class="table-text">Não conectado</text><text x="1285" y="852" class="code">NC</text>
    <line x1="945" y1="870" x2="1670" y2="870" stroke="#e2e8f0"/>
    <text x="955" y="905" class="table-pin">8</text><text x="1000" y="905" class="table-text">Sensor contador (+)</text><text x="1285" y="905" class="code">SENSOR_CONTADOR_ATIVO</text>
    <line x1="945" y1="923" x2="1670" y2="923" stroke="#e2e8f0"/>
    <text x="955" y="958" class="table-pin">9</text><text x="1000" y="958" class="table-text">Relé fecha (+)</text><text x="1285" y="958" class="code">SAIDA_3 / RELE_FECHA</text>
    <line x1="945" y1="976" x2="1670" y2="976" stroke="#e2e8f0"/>
    <text x="955" y="1011" class="table-pin">10</text><text x="1000" y="1011" class="table-text">Relé desce (+)</text><text x="1285" y="1011" class="code">SAIDA_2 / BOBINA_DESCE</text>
    <line x1="945" y1="1029" x2="1670" y2="1029" stroke="#e2e8f0"/>
    <text x="955" y="1064" class="table-pin">11</text><text x="1000" y="1064" class="table-text">Relé sobe/motor (+)</text><text x="1285" y="1064" class="code">SAIDA_1 / BOBINA_SOBE</text>
    <line x1="945" y1="1082" x2="1670" y2="1082" stroke="#e2e8f0"/>
    <text x="955" y="1117" class="table-pin">12</text><text x="1000" y="1117" class="table-text">GND</text>
  </g>

  <text x="900" y="1218" text-anchor="middle" class="small">Documento visual de referência — conferir orientação pela trava do conector antes da montagem</text>
</svg>
